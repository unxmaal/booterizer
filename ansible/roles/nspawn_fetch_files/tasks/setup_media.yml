- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    recurse: yes
  with_items:
    - "/srv/irix/{{ irixversion }}/Overlay/disc1"
    - "/srv/irix/{{ irixversion }}/Overlay/disc2"
    - "/srv/irix/{{ irixversion }}/Overlay/disc3"
    - "/srv/irix/{{ irixversion }}/Overlay/apps"
    - "/srv/irix/{{ irixversion }}/Overlay/capps"
    - "/srv/irix/Foundation/disc1"
    - "/srv/irix/Foundation/disc2"
    - "/srv/irix/Foundation/nfs"
    - "/srv/irix/Development/devlibs"
    - "/srv/irix/Development/devfoundations"
    - "/srv/irix/Development/mipspro"
    - "/srv/irix/Development/mipspro_update"
    - "/srv/irix/Development/mipspro_update"
    - "/srv/irix/Development/mipspro_c"
    - "/srv/irix/Development/mipspro_cee"
    - "/srv/irix/Development/mipspro_cpp"
    - "/srv/irix/Development/mipspro_ap"
    - "/srv/irix/Development/prodev"
    - "/srv/irix/Extras/perfcopilot"
    - "/srv/irix/Extras/sgifonts"

# Determine if things are already fetched
- name: Check overlay disc 1
  stat:
    path: "/srv/irix/{{ irixversion }}/Overlay/disc1/dist"
  register: old1

- name: Check overlay disc 2
  stat:
    path: "/srv/irix/{{ irixversion }}/Overlay/disc2/dist"
  register: old2

- name: Check overlay disc 3
  stat:
    path: "/srv/irix/{{ irixversion }}/Overlay/disc3/dist"
  register: old3

- name: Check overlay apps
  stat:
    path: "/srv/irix/{{ irixversion }}/Overlay/apps/dist"
  register: olapps

- name: Check overlay complementary apps
  stat:
    path: "/srv/irix/{{ irixversion }}/Overlay/capps/dist"
  register: olcompapps



# these are common across .30 and .22

- name: Check foundation disc 1
  stat:
    path: "/srv/irix/Foundation/disc1/dist"
  register: fd1

- name: Check foundation disc 2
  stat:
    path: "/srv/irix/Foundation/disc2/dist"
  register: fd2

- name: Check foundation NFS
  stat:
    path: "/srv/irix/Foundation/nfs/dist"
  register: fnfs

- name: Check development libraries
  stat:
    path: "/srv/irix/Development/devlibs/dist"
  register: devl

- name: Check development foundations
  stat:
    path: "/srv/irix/Development/devfoundations/dist"
  register: devf

- name: Check MIPSPro 7.4.3m
  stat:
    path: "/srv/irix/Development/mipspro/dist"
  register: mp

- name: Check MIPSPro 7.4.4 update
  stat:
    path: "/srv/irix/Development/mipspro_update/inst.README"
  register: mpu

- name: Check MIPSPro c
  stat:
    path: "/srv/irix/Development/mipspro_c/dist"
  register: mpc

- name: Check MIPSPro cee
  stat:
    path: "/srv/irix/Development/mipspro_cee/dist"
  register: mpcee

- name: Check MIPSPro cpp
  stat:
    path: "/srv/irix/Development/mipspro_cpp/dist"
  register: mpcpp

- name: Check MIPSPro ap
  stat:
    path: "/srv/irix/Development/mipspro_ap/dist"
  register: mpap

- name: Check prodev
  stat:
    path: "/srv/irix/Development/prodev/dist"
  register: prodev

- name: Check perfcopilot
  stat:
    path: "/srv/irix/Extras/perfcopilot/dist"
  register: pc

- name: Check SGI Fonts
  stat:
    path: "/srv/irix/Extras/sgifonts/Text"
  register: sf












# these are specific and go into their own dirs for .30 and .22

- name: Fetch overlay disc 1
  get_url:
    url: "{{ overlay_baseurl }}{{ overlay_disc1 }}"
    dest: "/srv/irix/{{ irixversion }}/Overlay/disc1/{{ overlay_disc1 }}"
  when: not old1.stat.exists

- name: Fetch overlay disc 2
  get_url:
    url: "{{ overlay_baseurl }}{{ overlay_disc2 }}"
    dest: "/srv/irix/{{ irixversion }}/Overlay/disc2/{{ overlay_disc2 }}"
  when: not old2.stat.exists

- name: Fetch overlay disc 3
  get_url:
    url: "{{ overlay_baseurl }}{{ overlay_disc3 }}"
    dest: "/srv/irix/{{ irixversion }}/Overlay/disc3/{{ overlay_disc3 }}"
  when: not old3.stat.exists

- name: Fetch overlay apps
  get_url:
    url: "{{ overlay_baseurl }}{{ overlay_apps }}"
    dest: "/srv/irix/{{ irixversion }}/Overlay/apps/{{ overlay_apps }}"
  when: not olapps.stat.exists

- name: Fetch overlay complementary apps
  get_url:
    url: "{{ overlay_baseurl }}{{ overlay_capps }}"
    dest: "/srv/irix/{{ irixversion }}/Overlay/capps/{{ overlay_capps }}"
  when: irixversion == "6.5.30" and not olcompapps.stat.exists

# these are common across .30 and .22

- name: Fetch foundation disc 1
  get_url:
    url: "{{ foundation_baseurl }}{{ foundation_disc1 }}"
    dest: "/srv/irix/Foundation/disc1/{{ foundation_disc1 }}"
  when: not fd1.stat.exists

- name: Fetch foundation disc 2
  get_url:
    url: "{{ foundation_baseurl }}{{ foundation_disc2 }}"
    dest: "/srv/irix/Foundation/disc2/{{ foundation_disc2 }}"
  when: not fd2.stat.exists

- name: Fetch foundation NFS
  get_url:
    url: "{{ foundation_baseurl }}{{ foundation_nfs }}"
    dest: "/srv/irix/Foundation/nfs/{{ foundation_nfs }}"
  when: not fnfs.stat.exists

- name: Fetch development libraries
  get_url:
    url: "{{ devel_baseurl }}{{ devel_devlibs }}"
    dest: "/srv/irix/Development/devlibs/{{ devel_devlibs }}"
  when: not devl.stat.exists

- name: Fetch development foundations
  get_url:
    url: "{{ devel_baseurl }}{{ devel_devfoundations }}"
    dest: "/srv/irix/Development/devfoundations/{{ devel_devfoundations }}"
  when: not devf.stat.exists

- name: Fetch MIPSPro 7.4.3m
  get_url:
    url: "{{ devel_baseurl }}{{ devel_mipspro }}"
    dest: "/srv/irix/Development/mipspro/{{ devel_mipspro }}"
  when: not mp.stat.exists

- name: Fetch MIPSPro 7.4.4 update
  get_url:
    url: "{{ devel_baseurl }}{{ devel_update }}"
    dest: "/srv/irix/Development/mipspro_update/{{ devel_update }}"
  when: not mpu.stat.exists

- name: Fetch MIPSPro c
  get_url:
    url: "{{ devel_baseurl }}{{ devel_c }}"
    dest: "/srv/irix/Development/mipspro_c/{{ devel_c }}"
  when: not mpc.stat.exists

- name: Fetch MIPSPro cee
  get_url:
    url: "{{ devel_baseurl }}{{ devel_cee }}"
    dest: "/srv/irix/Development/mipspro_cee/{{ devel_cee }}"
  when: not mpcee.stat.exists

- name: Fetch MIPSPro cpp
  get_url:
    url: "{{ devel_baseurl }}{{ devel_cpp }}"
    dest: "/srv/irix/Development/mipspro_cpp/{{ devel_cpp }}"
  when: not mpcpp.stat.exists

- name: Fetch MIPSPro ap
  get_url:
    url: "{{ devel_baseurl }}{{ devel_ap }}"
    dest: "/srv/irix/Development/mipspro_ap/{{ devel_ap }}"
  when: not mpap.stat.exists

- name: Fetch prodev
  get_url:
    url: "{{ devel_baseurl }}{{ devel_prodev }}"
    dest: "/srv/irix/Development/prodev/{{ devel_prodev }}"
  when: not prodev.stat.exists

- name: Fetch perfcopilot
  get_url:
    url: "{{ extras_baseurl }}{{ extras_perfcopilot }}"
    dest: "/srv/irix/Extras/perfcopilot/{{ extras_perfcopilot }}"
  when: not pc.stat.exists

- name: Fetch SGI Fonts
  get_url:
    url: "{{ extras_baseurl }}{{ extras_sgifonts }}"
    dest: "/srv/irix/Extras/sgifonts/{{ extras_sgifonts }}"
  when: not sf.stat.exists


# Extraction
- name: Extracting foundation disc 1
  unarchive:
    src: "/srv/irix/Foundation/disc1/{{ foundation_disc1 }}"
    dest: "/srv/irix/Foundation/disc1/"
    copy: no
    extra_opts:
    - --strip-components=1
    creates: "/srv/irix/Foundation/disc1/RELEASE.info"

- name: Extracting foundation disc 2
  unarchive:
    src: "/srv/irix/Foundation/disc2/{{ foundation_disc2 }}"
    dest: "/srv/irix/Foundation/disc2/"
    copy: no
    extra_opts:
    - --strip-components=1
    creates: "/srv/irix/Foundation/disc2/RELEASE.info"

- name: Extracting foundation NFS
  unarchive:
    src: "/srv/irix/Foundation/nfs/{{ foundation_nfs }}"
    dest: "/srv/irix/Foundation/nfs/"
    copy: no
    extra_opts:
    - --strip-components=1
    creates: "/srv/irix/Foundation/nfs/RELEASE.info"


