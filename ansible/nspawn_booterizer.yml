---
- name: Set up the local host
  hosts: all
  become: yes
  tasks:
  - include_vars:
      name: settings
      file: ../settings.yml
  - import_role:
      name: create_xfsvol
  - import_role:
      name: nspawn_netbridge
  - import_role:
      name: nspawn_setup
  - import_role:
      name: nspawn_configure
  - import_role:
      name: nspawn_start

