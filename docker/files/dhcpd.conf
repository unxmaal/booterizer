# DHCP/BOOTP configuration for booterizer
# This file is a template - for runtime configuration, use environment
# variables with the entrypoint script (Phase 2)

# Enable BOOTP protocol (required for SGI PROM)
allow booting;
allow bootp;

# Subnet declaration - must match your direct-cable network
# Using 192.168.42.0/24 to avoid conflicts with common home networks
subnet 192.168.42.0 netmask 255.255.255.0 {
  # Only respond to known clients (the SGI machine)
  ignore unknown-clients;
}

# SGI host configuration
# UPDATE THESE VALUES for your SGI machine:
#   hardware ethernet: MAC address of SGI (found in PROM: printenv eaddr)
#   fixed-address: IP to assign to SGI
#   filename: path to boot image (fx.64 for partitioning, sash64 for install)
host sgi {
  hardware ethernet 08:00:69:0c:9d:5f;
  fixed-address 192.168.42.2;
  option domain-name-servers 192.168.42.1;
  option domain-name "local";
  # Boot image path relative to TFTP root (/srv/irix)
  # fx.64 = partitioner, sashARCS/sash64 = installer
  filename "6.5.30/Overlay/disc1/stand/fx.64";
}
